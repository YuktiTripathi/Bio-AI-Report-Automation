<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="100" height="2" viewBox="0 0 100 2" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Figma dasharray 5 5 as filled rects — stroke-based dashes render unevenly in Chromium PDF -->
  <g fill="#063533">
    <rect x="0" y="0.5" width="5" height="1"/>
    <rect x="10" y="0.5" width="5" height="1"/>
    <rect x="20" y="0.5" width="5" height="1"/>
    <rect x="30" y="0.5" width="5" height="1"/>
    <rect x="40" y="0.5" width="5" height="1"/>
    <rect x="50" y="0.5" width="5" height="1"/>
    <rect x="60" y="0.5" width="5" height="1"/>
    <rect x="70" y="0.5" width="5" height="1"/>
    <rect x="80" y="0.5" width="5" height="1"/>
    <rect x="90" y="0.5" width="5" height="1"/>
  </g>
</svg>
