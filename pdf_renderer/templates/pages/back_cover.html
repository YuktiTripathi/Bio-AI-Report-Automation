{# Back cover — Figma node 451:6850; static for all PDFs #}
<section
  class="page bc-figma"
  data-template="BackCover"
  data-page="{{ vm.page_count }}"
  data-node-id="451:6850"
>
  <div class="bc-figma__bg" aria-hidden="true">
    <img class="bc-figma__bg-img" src="{{ assets.bc_bg }}" alt="" />
  </div>
  <div class="bc-figma__deco" aria-hidden="true">
    <div class="bc-figma__deco-rot">
      <img class="bc-figma__deco-img" src="{{ assets.bc_deco }}" alt="" />
    </div>
  </div>

  <div class="bc-figma__hero">
    <div class="bc-figma__logo" aria-label="Super Shyft">
      <img class="bc-figma__logo-layer bc-figma__logo-layer--ring-outer" src="{{ assets.bc_logo_group }}" alt="" />
      <img class="bc-figma__logo-layer bc-figma__logo-layer--ring" src="{{ assets.bc_logo_ring }}" alt="" />
      <img class="bc-figma__logo-layer bc-figma__logo-layer--inner" src="{{ assets.bc_logo_inner }}" alt="" />
      <img class="bc-figma__logo-layer bc-figma__logo-layer--text" src="{{ assets.bc_logo_text }}" alt="" />
    </div>
    <div class="bc-figma__copy">
      <h1 class="bc-figma__title">
        <span class="bc-figma__title-line">Prevention starts with a</span>
        <span class="bc-figma__title-accent">Conversation</span>
      </h1>
      <p class="bc-figma__subtitle">
        Every preventive journey needs a trusted companion - let us be yours.
      </p>
    </div>
  </div>

  <div class="bc-figma__contact">
    <div class="bc-figma__contact-row">
      <img class="bc-figma__contact-icon" src="{{ assets.bc_icon_web }}" alt="" />
      <span>www.supershyft.com</span>
    </div>
    <div class="bc-figma__contact-row">
      <img class="bc-figma__contact-icon" src="{{ assets.bc_icon_phone }}" alt="" />
      <span>+91 8209512559</span>
    </div>
    <div class="bc-figma__contact-row">
      <img class="bc-figma__contact-icon" src="{{ assets.bc_icon_email }}" alt="" />
      <span>support@supershyft.com</span>
    </div>
  </div>

  <div class="bc-figma__social">
    <p class="bc-figma__social-label">Connect with us:</p>
    <div class="bc-figma__social-row">
      <img class="bc-figma__social-icon" src="{{ assets.bc_icon_linkedin }}" alt="LinkedIn" />
      <img class="bc-figma__social-icon" src="{{ assets.bc_icon_instagram }}" alt="Instagram" />
    </div>
  </div>

  <div class="bc-figma__footer">
    <div class="bc-figma__powered">
      <span>Poweredby</span>
      <img src="{{ assets.bc_metflux }}" alt="MetFlux Research" />
    </div>
    <img class="bc-figma__mark" src="{{ assets.bc_mark }}" alt="Super Shyft" />
  </div>
</section>
